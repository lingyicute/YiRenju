name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同一分支只保留最新一次运行，避免连续 push 堆积 4 分钟的旧任务
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline & self-bootstrap contract
        run: node tests/offline-contract.mjs
      - name: Rule engine & AI unit tests
        run: node tests/renju-core-test.mjs
      - name: TT mate-score regression
        run: node tests/tt-mate-regression-test.mjs
      - name: Search control regressions (frozen clock, zero deps)
        run: node tests/ai-search-regression.mjs
      - name: Optimisation equivalence regressions (naive reference impls)
        run: node tests/ai-opt-regression.mjs
      - name: AI decision safety regressions (frozen clock, zero deps)
        run: node tests/ai-safety-regression.mjs
      - name: Independent AI rules and state regressions
        run: node tests/ai-review-regression.mjs
      - name: Full-game smoke (real aiChoose path, shortened budget)
        run: node tests/ai-selfplay-smoke.mjs
        env:
          SMOKE_MS: 250

  e2e:
    runs-on: ubuntu-latest
    # 官方镜像预装 chromium-headless-shell 与全部系统依赖（含中文字体），
    # 彻底避开 apt-get 镜像抖动与浏览器 CDN 下载，e2e 无需联网准备环境。
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install playwright-core (browser already in the image)
        timeout-minutes: 3
        run: npm i --no-save --no-audit --no-fund playwright-core@1.64.1
      - name: Serve and run browser e2e
        run: |
          python3 -m http.server 8600 &
          sleep 1
          node tests/renju-e2e.mjs
