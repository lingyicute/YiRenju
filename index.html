/* ============ 基础与主题变量 ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
:root{
  --font:"Nebulove","Yuanti SC","YouYuan","幼圆",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --r-lg:24px; --r-md:18px;
}
:root{--acc:#a78bfa;--acc-deep:#6a54c8} /* 兜底：accent 规则失效时降级为紫色 */
[data-accent="purple"]{--acc:#a78bfa;--acc-deep:#6a54c8}
[data-accent="blue"]{--acc:#82aaff;--acc-deep:#3f63c0}
[data-accent="teal"]{--acc:#5edfd0;--acc-deep:#0f7a6e}
[data-accent="green"]{--acc:#6fdc8c;--acc-deep:#1e7a3c}
[data-accent="yellow"]{--acc:#ecc64f;--acc-deep:#7d660d}
[data-accent="orange"]{--acc:#f6ad7b;--acc-deep:#a04d08}
[data-accent="pink"]{--acc:#f17bb0;--acc-deep:#b02e6e}
[data-accent="red"]{--acc:#ef6f6f;--acc-deep:#c03230}

html[data-theme="light"]{
  color-scheme:light;
  --bg:color-mix(in srgb,var(--acc) 7%,#faf8fe);
  --glow:color-mix(in srgb,var(--acc) 16%,transparent);
  --on-surface:#252031;
  --on-surface-2:color-mix(in srgb,var(--acc) 8%,#5b5666);
  --container:color-mix(in srgb,var(--acc) 12%,#f5f2fb);
  --container-high:color-mix(in srgb,var(--acc) 26%,#eee8fd);
  --float:color-mix(in srgb,var(--acc) 8%,#ffffff);
  --tonal:color-mix(in srgb,var(--acc) 7%,#edebf2);
  --primary:var(--acc-deep);
  --on-primary:#fdfbff;
  --pcontainer:var(--acc-deep);
  --on-pcontainer:#ffffff;
  --outline:color-mix(in srgb,var(--acc) 12%,#7a7584);
  --board-bg:color-mix(in srgb,var(--acc) 15%,#faf8ff);
  --grid-line:color-mix(in srgb,#37304a 42%,transparent);
  --grid-strong:color-mix(in srgb,#37304a 62%,transparent);
  --stone-ba:#575064;--stone-bb:#16111f;
  --stone-wa:#ffffff;--stone-wb:#d3cede;
  --stone-wst:color-mix(in srgb,#6f6880 45%,transparent);
  --scrim:rgba(24,16,40,.42);
  --shadow:0 14px 44px rgba(28,18,54,.14);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:color-mix(in srgb,var(--acc) 4%,#100d17);
  --glow:color-mix(in srgb,var(--acc) 12%,transparent);
  --on-surface:#f1edfa;
  --on-surface-2:color-mix(in srgb,var(--acc) 8%,#a29cafc2);
  --container:color-mix(in srgb,var(--acc) 9%,#1e1b29);
  --container-high:color-mix(in srgb,var(--acc) 30%,#342b4e);
  --float:color-mix(in srgb,var(--acc) 11%,#282334);
  --tonal:color-mix(in srgb,var(--acc) 8%,#2b2737);
  --primary:var(--acc);
  --on-primary:#241839;
  --pcontainer:color-mix(in srgb,var(--acc-deep) 72%,#262033);
  --on-pcontainer:#efe9ff;
  --outline:color-mix(in srgb,var(--acc) 16%,#6f6980);
  --board-bg:color-mix(in srgb,var(--acc) 12%,#1a1624);
  --grid-line:color-mix(in srgb,#efeafa 30%,transparent);
  --grid-strong:color-mix(in srgb,#efeafa 52%,transparent);
  --stone-ba:#5d5670;--stone-bb:#0c0912;
  --stone-wa:#ffffff;--stone-wb:#c7c2d6;
  --stone-wst:color-mix(in srgb,#3b3350 55%,transparent);
  --scrim:rgba(6,4,12,.6);
  --shadow:0 16px 48px rgba(0,0,0,.42);
}
body{
  font-family:var(--font);
  background:radial-gradient(1100px 520px at 72% -8%,var(--glow),transparent 62%),var(--bg);
  color:var(--on-surface);
  min-height:100vh;
  min-height:100dvh;
  -webkit-user-select:none;   /* 照顾只认带前缀写法的 Safari / iOS：缺了它长按或拖拽会选中界面文字 */
  user-select:none;
  transition:background .3s,color .3s;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
button:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px}
svg{display:block}

/* ============ 顶栏 ============ */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:1240px;margin:0 auto;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.app-icon{width:42px;height:42px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 78%,#8f7ff0));
  color:var(--on-primary)}
html[data-theme="dark"] .app-icon{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 88%,#fff),var(--acc))}
.brand-name{font-size:21px;font-weight:800;letter-spacing:.2px}
.brand-badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--container-high);color:var(--primary)}
.header-actions{display:flex;align-items:center;gap:2px;position:relative}
.icon-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--on-surface);transition:background .18s,transform .1s}
.icon-btn:hover{background:color-mix(in srgb,currentColor 8%,transparent)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.active{background:var(--container-high)}
html[data-theme="dark"] .ic-moon,html[data-theme="light"] .ic-sun{display:none}

/* 下拉菜单 */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:50px;min-width:196px;background:var(--float);border-radius:var(--r-md);
  box-shadow:var(--shadow);padding:8px;display:none;z-index:60}
.menu.open{display:block;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
.menu-item{display:flex;align-items:center;gap:13px;width:100%;padding:12px 14px;border-radius:12px;font-size:15px;font-weight:600;color:var(--on-surface);transition:background .15s}
.menu-item:hover{background:var(--container)}
.menu-item svg{color:var(--on-surface-2)}

/* ============ 主体布局 ============ */
main{max-width:600px;margin:0 auto;padding:2px 20px 40px}
.title-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:38px;font-weight:800;letter-spacing:1px}
.subtitle{color:var(--on-surface-2);font-weight:700;font-size:15px}

.stats-row{display:flex;align-items:center;gap:10px;margin-top:16px}
.stat-card{flex:1;min-width:0;background:var(--container);border-radius:var(--r-lg);padding:12px 16px;display:flex;flex-direction:column;gap:3px}
/* 两张卡片不等宽：「用时」只有几个数字，把宽度让给回合文字，否则「AI 思考中…」在桌面两栏与手机宽度下都会被截断 */
.stat-card.accent{background:var(--container-high);flex:.33;min-width:64px}
.stat-label{font-size:12.5px;font-weight:700;color:var(--on-surface-2);white-space:nowrap}
.stat-value{font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.stone-dot{width:16px;height:16px;border-radius:50%;flex:none}
.stone-dot.black{background:radial-gradient(circle at 34% 30%,var(--stone-ba),var(--stone-bb))}
.stone-dot.white{background:radial-gradient(circle at 34% 30%,var(--stone-wa),var(--stone-wb));box-shadow:0 0 0 1px var(--stone-wst)}
.btn-round{width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;transition:filter .15s,transform .1s,opacity .2s,background .2s}
.btn-round:active{transform:scale(.94)}
.btn-round:disabled{opacity:.35;pointer-events:none}
.btn-tonal{background:var(--tonal);color:var(--on-surface)}
.btn-tonal:hover{filter:brightness(1.06)}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(1.1)}

/* 棋盘 */
.board-wrap{width:100%}
#board{display:block;margin:18px auto 0;touch-action:manipulation;cursor:pointer;
  filter:drop-shadow(0 12px 30px color-mix(in srgb,#000 18%,transparent))}
#board:focus-visible{outline:3px solid var(--primary);outline-offset:5px;border-radius:18px}

/* 难度选择 chips */
.modes{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:999px;
  border:1.5px solid var(--outline);font-size:15px;font-weight:700;color:var(--on-surface);
  transition:background .18s,border-color .18s,transform .1s}
.chip:hover{background:var(--container)}
.chip:active{transform:scale(.96)}
.chip.sel{background:var(--container-high);border-color:transparent}
.chip .ck{display:none;color:var(--primary)}
.chip.sel .ck{display:block}

/* 底部说明 */
.help-text{margin-top:26px;text-align:center;font-size:12.5px;line-height:2.3;color:var(--on-surface-2)}
.key{display:inline-block;min-width:23px;padding:1px 6px;margin:0 1px;border:1px solid var(--outline);border-bottom-width:2.5px;
  border-radius:6px;background:var(--container);font-size:11px;font-weight:700;text-align:center;color:var(--on-surface)}

/* ============ 对话框 ============ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .15s ease-out}
.scrim[hidden]{display:none}
@keyframes fade{from{opacity:0}}
.dialog{width:100%;max-width:440px;max-height:calc(100vh - 64px);max-height:calc(100dvh - 64px);overflow:auto;background:var(--float);border-radius:28px;
  padding:28px 26px;box-shadow:var(--shadow);animation:up .2s ease-out}
@keyframes up{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
.dlg-icon{width:54px;height:54px;border-radius:17px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
  background:var(--pcontainer);color:var(--on-pcontainer)}
.dlg-title{text-align:center;font-size:21px;font-weight:800;margin-bottom:14px}
.dlg-body{font-size:14.5px;line-height:2.05;color:var(--on-surface-2)}
.dlg-body b{color:var(--on-surface)}
.dlg-btns{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn-pill{padding:11px 24px;border-radius:999px;font-size:14.5px;font-weight:700;transition:filter .15s,transform .1s}
.btn-pill:active{transform:scale(.96)}
.btn-pill.primary{background:var(--primary);color:var(--on-primary)}
.btn-pill.primary:hover{filter:brightness(1.1)}
.btn-pill.text{color:var(--primary)}
.btn-pill.text:hover{background:var(--container)}

/* 配色面板 */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 10px;justify-items:center;margin-top:20px}
.swatch{width:54px;height:54px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.swatch:hover{transform:scale(1.08)}
.swatch.sel{box-shadow:0 0 0 3px var(--float),0 0 0 5px currentColor}
.swatch .ck{color:#251a3d}

/* 战绩 */
.rec-head,.rec-row{display:grid;grid-template-columns:1fr 1.4fr .8fr;gap:8px;padding:9px 4px;font-size:14.5px;align-items:center}
.rec-head{font-size:12.5px;font-weight:700;color:var(--on-surface-2)}
.rec-row{border-top:1px solid color-mix(in srgb,var(--outline) 30%,transparent);font-weight:600}
.rec-row span:last-child,.rec-head span:last-child{text-align:right}
.rec-row .rate{color:var(--primary);font-weight:800}

/* Toast：left:50% 的定位元素默认按「右半屏」收缩定宽，手机上稍长的提示会被挤成半屏宽并折行；
   改为按内容定宽、以视口宽度封顶 */
.toast{position:fixed;left:50%;bottom:34px;width:max-content;max-width:calc(100% - 32px);transform:translate(-50%,20px);background:var(--float);color:var(--on-surface);
  box-shadow:var(--shadow);padding:11px 22px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;
  text-align:center;transition:opacity .25s,transform .25s;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* 旧版浏览器（Chrome < 111 等）不支持 color-mix()：上面的变量会整体失效，背景全部透明。
   此处回退为按默认紫色预先算好的静态色值（强调色仍由 --acc / --primary 生效）。 */
@supports not (color:color-mix(in srgb,red 50%,blue)){
  html[data-theme="light"]{--bg:#f4f0fe;--glow:rgba(167,139,250,.16);--on-surface-2:#615a72;--container:#ece6fb;--container-high:#dcd0fc;--float:#f8f6ff;--tonal:#e8e4f3;--outline:#7f7892;--board-bg:#eee8fe;--grid-line:rgba(55,48,74,.42);--grid-strong:rgba(55,48,74,.62);--stone-wst:rgba(111,104,128,.45)}
  html[data-theme="dark"]{--bg:#161220;--glow:rgba(167,139,250,.12);--on-surface-2:rgba(163,154,183,.78);--container:#2a253c;--container-high:#574882;--float:#362e4a;--tonal:#352f47;--pcontainer:#57459e;--outline:#786e94;--board-bg:#2b243e;--grid-line:rgba(239,234,250,.3);--grid-strong:rgba(239,234,250,.52);--stone-wst:rgba(59,51,80,.55)}
  .app-icon{background:var(--primary)}
  html[data-theme="dark"] .app-icon{background:var(--acc)}
  .icon-btn:hover{background:var(--container)}
  #board{filter:drop-shadow(0 12px 30px rgba(0,0,0,.18))}
  .rec-row{border-top-color:rgba(128,128,140,.3)}
}

/* 仅屏幕阅读器可见：状态播报与棋盘说明 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0;font-family:system-ui,sans-serif}

<script id="main">
/*APP_START*/
'use strict';
/* ================= 工具与存储 ================= */
const $=id=>document.getElementById(id);
const LS={
  /* 命名空间 yimoku.* → yirenju.*：仅迁移旧主题/配色；战绩与对局因规则变更不继承 */
  get(k,d){
    try{
      const v=localStorage.getItem('yirenju.'+k);
      if(v!=null)return JSON.parse(v);
      if(k==='settings'){
        const old=localStorage.getItem('yimoku.settings');
        if(old!=null){
          const o=JSON.parse(old)||{};
          return {theme:o.theme||null,accent:o.accent||'purple',mode:d&&d.mode?d.mode:'ai-easy'};
        }
      }
      return d;
    }catch(e){return d;}
  },
  set(k,v){try{localStorage.setItem('yirenju.'+k,JSON.stringify(v));}catch(e){}}
};
const ACCENTS={purple:'#a78bfa',blue:'#82aaff',teal:'#5edfd0',green:'#6fdc8c',yellow:'#ecc64f',orange:'#f6ad7b',pink:'#f17bb0',red:'#ef6f6f'};
/* 只认自有键：ACCENTS[a] 对 'constructor'、'toString'、'__proto__' 等原型键也为真 */
const isAccent=a=>Object.prototype.hasOwnProperty.call(ACCENTS,a);
const MODE_LABEL={'ai-easy':'简单','ai-medium':'中等','ai-hard':'困难','ai-expert':'专家','pvp':'双人'};
const SUBTITLE={'ai-easy':'人机对战 · 简单','ai-medium':'人机对战 · 中等','ai-hard':'人机对战 · 困难','ai-expert':'人机对战 · 专家','pvp':'双人同屏'};
const DIFF_KEYS=['easy','medium','hard','expert'];

/*CORE_START*/
/* ================= 核心逻辑（棋盘与 AI，纯函数） ================= */
const N=15, EMPTY=0, BLACK=1, WHITE=2;
const DIRS=[[1,0],[0,1],[1,1],[1,-1]];
let board=Array.from({length:N},()=>new Array(N).fill(EMPTY));
let mode='ai-easy';
let boardStones=0; /* 真实/搜索落子的占用数；临时形态试落不读取此计数 */

const inB=(x,y)=>x>=0&&x<N&&y>=0&&y<N;

/* ===== 盘面变更的唯一入口 =====
   CAND1/CAND2 记录每点周围（切比雪夫距离 1、2）的棋子数，候选点生成因此退化为一次
   225 格扫描，不必在每个搜索结点上重建 Set（原版每手要重建上万次）。
   搜索结点的落子/撤子必须走 pushStone()，同步候选计数与 Zobrist 哈希；
   只为算分而临时写格的函数（evalPoint / ptsToFiveThrough / blackLegality / winPointsBoth /
   fourMoves）不改计数表——它们都不会在写格期间调用 candidates()。 */
const CAND1=new Int16Array(N*N),CAND2=new Int16Array(N*N);
const OFF1=[],OFF2=[];
for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(dx||dy)OFF1.push(dx,dy);
for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++)if(dx||dy)OFF2.push(dx,dy);
function candTouch(x,y,d){
  for(let i=0;i<OFF1.length;i+=2){const nx=x+OFF1[i],ny=y+OFF1[i+1];if(inB(nx,ny))CAND1[nx*N+ny]+=d;}
  for(let i=0;i<OFF2.length;i+=2){const nx=x+OFF2[i],ny=y+OFF2[i+1];if(inB(nx,ny))CAND2[nx*N+ny]+=d;}
}
/* ===== 方向势能表 WC[dir][color][idx] =====
   WC 记录「从该点沿某方向 ±4 内的同色子数」——正是 winCount() 的定义。
   它在落子/撤子的唯一入口 setCell() 里增量维护（每子 4 方向 × 8 点 = 32 处 +1），
   把原本逐点扫盘的 winCount() 变成一次查表，并把两条安全下界变成 O(1)：
     · 补一子成五（经过该点的连子恰五/≥五）⇒ 该方向 ±4 内必须已有 4 个同色子 ⇒ 先查 WC≥4；
     · winCount≥3 是该方向可能存在「四」的必要条件（与原 fourMoves 下界筛同源）。
   不变量（重要）：读表时 WC 必须与盘面一致。凡是「落一颗临时子后还要在别的点查表」
   的地方（blackLegality / isFreeThreeDir / fourMoves 的试落），一律走 wcTemp/wcUntemp
   （只同步 WC，必须成对）；只有「内部查表点恒为本格（winCount 不计中心格）」的纯估价/
   形态枚举（evalPoint / ptsToFiveThrough / winPointsBoth / winPointsOne / fivePoint /
   blackWinPoint）才用裸写格，连 WC 也不必更新。 */
const WN=N*N;
const WC=[new Int16Array(2*WN),new Int16Array(2*WN),new Int16Array(2*WN),new Int16Array(2*WN)];
function wcTouch(x,y,c,d){       /* d=+1 落子 / -1 撤子；c 为该子颜色 */
  const b=c===BLACK?0:WN,t0=WC[0],t1=WC[1],t2=WC[2],t3=WC[3];
  for(let o=1;o<=4;o++){
    let a=x+o;if(a<N)t0[b+a*N+y]+=d;
    a=x-o;if(a>=0)t0[b+a*N+y]+=d;
    let e=y+o;if(e<N)t1[b+x*N+e]+=d;
    e=y-o;if(e>=0)t1[b+x*N+e]+=d;
    a=x+o;e=y+o;if(a<N&&e<N)t2[b+a*N+e]+=d;
    a=x-o;e=y-o;if(a>=0&&e>=0)t2[b+a*N+e]+=d;
    a=x+o;e=y-o;if(a<N&&e>=0)t3[b+a*N+e]+=d;
    a=x-o;e=y+o;if(a>=0&&e<N)t3[b+a*N+e]+=d;
  }
}
function setCell(x,y,p){
  const old=board[x][y];
  if(old!==p){
    if(old!==EMPTY)wcTouch(x,y,old,-1);
    if(p!==EMPTY)wcTouch(x,y,p,1);
  }
  board[x][y]=p;
  const occupiedDelta=Number(p!==EMPTY)-Number(old!==EMPTY);
  if(occupiedDelta){candTouch(x,y,occupiedDelta);boardStones+=occupiedDelta;}
}
/* 只维护 WC 的临时落子/撤子：给「落了临时子还要在别处查表」的试落路径用
   （blackLegality / isFreeThreeDir / fourMoves）。比 pushStone 省掉候选计数与 Zobrist
   的 32+ 邻域更新；这些窗口内不调用 candidates()、也不跑 negamax（无 TT 探测），
   故 CAND/哈希保持原样即可，但窗口内必须成对使用 wcTemp / wcUntemp。 */
function wcTemp(x,y,p){board[x][y]=p;wcTouch(x,y,p,1);}
function wcUntemp(x,y,p){wcTouch(x,y,p,-1);board[x][y]=EMPTY;}
function pushStone(x,y,p){
  const old=board[x][y];
  setCell(x,y,p);
  /* Zobrist 增量维护：先撤旧子、再落新子（XOR 对合，EMPTY 只撤不落）。
     旧版撤子统一传 EMPTY，而 hashPlace 把非黑一律按白键 XOR——每撤一颗黑子就
     掺入一对白键噪声，zh1/zh2 随试撤次数漂移，同一局面从不同分支到达时键值不同，
     置换表跨分支永不命中（TT 与 ttMove 排序实际失效）。 */
  if(old!==p){hashPlace(x,y,old);hashPlace(x,y,p);}
}
function clearBoard(){          /* 原地清零：不重新赋值 board，避免任何已持有的引用失效 */
  zh1=0;zh2=0;
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)board[x][y]=EMPTY;
  boardStones=0;
  CAND1.fill(0);CAND2.fill(0);
  for(let i=0;i<4;i++)WC[i].fill(0);
}
/* 思考前与真实盘面对齐一次（读档/harness 等路径可能整体替换 board 数组） */
function syncCand(){
  boardStones=0;
  CAND1.fill(0);CAND2.fill(0);
  for(let i=0;i<4;i++)WC[i].fill(0);
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){
    const v=board[x][y];
    if(v===EMPTY)continue;
    boardStones++;candTouch(x,y,1);wcTouch(x,y,v,1);
  }
  hashFromBoard();
}

/* 经过 (x,y) 沿 (dx,dy) 的连子数与两端开放数（要求 board[x][y]===p）。
   返回复用的定长数组 RUN：这是全引擎最热的一段（evalPoint/isWinRun/禁手判定都走它），
   原实现每次返回新 [c,o]，一次 3 秒搜索要产生上千万个短命数组喂给 GC。
   调用方全部当场消费 r[0]/r[1]，无人跨调用持有该数组；勿让新调用方存下引用。 */
const RUN=[0,0];
function runInfo(x,y,dx,dy,p){
  let c=1,o=0,i=1,j=1,nx,ny;
  while(inB(nx=x+dx*i,ny=y+dy*i)&&board[nx][ny]===p){c++;i++;}
  if(inB(nx,ny)&&board[nx][ny]===EMPTY)o++;
  while(inB(nx=x-dx*j,ny=y-dy*j)&&board[nx][ny]===p){c++;j++;}
  if(inB(nx,ny)&&board[nx][ny]===EMPTY)o++;
  RUN[0]=c;RUN[1]=o;
  return RUN;
}
/* 只求两侧连子长度（不含中心）：LR[0]=负向连子数，LR[1]=正向连子数。
   runInfo 的 o（两端是否开放）在这里用不上，而下面的「补点唯一性」变换需要 L/R 分列。
   与 RUN 同样复用定长数组，调用方当场消费。 */
const LR=[0,0];
function lrInfo(x,y,dx,dy,p){
  let a=0,b=0,nx,ny;
  while(inB(nx=x+dx*(a+1),ny=y+dy*(a+1))&&board[nx][ny]===p)a++;   /* a: +方向 */
  while(inB(nx=x-dx*(b+1),ny=y-dy*(b+1))&&board[nx][ny]===p)b++;   /* b: -方向 */
  LR[0]=b;LR[1]=a;
  return LR;
}
function dirScore(c,o,side){
  if(c===5)return 1000000;                       /* 五连（黑棋必须恰好五连） */
  if(c>5)return side===BLACK?5:1000000;          /* 长连：黑禁手无用，白算胜 */
  if(o===0)return c===3?90:c===2?12:1;          /* 两端皆堵：死三/死二；死四已无成五可能，不应高于活二 */
  if(c===4)return o===2?150000:20000; /* 活四 / 冲四 */
  if(c===3)return o===2?12000:1500;   /* 活三 / 眠三 */
  if(c===2)return o===2?900:110;
  return o===2?30:8;
}
/* 分离型棋形（跳三 X.XX、断四 XX.XX 等）：连续段统计 dirScore 看不见它们。
   这里对包含本子的每个 5 格窗口补算：窗口内无对方子，且己方子之间有空隙时才计分
   （连续棋形仍由 dirScore 负责，不重复计分）。断四的威胁与连续冲四相当。 */
const SPLIT3=3000,SPLIT4=12000;
function splitScore(x,y,dx,dy,p){
  /* 下界筛（与 winCount 在禁手判定里的用法同构）：分离形至少要有 3 个己方子落在某个
     含 (x,y) 的 5 格窗内，(x,y) 占 1 子，其余子必在 ±4 内 ⇒ 同色邻子不足 2 直接放弃
     5×5 窗扫描。orderedMoves→evalPoint 是搜索的第一热点，中盘大多数方向过不了这道筛子。 */
  if(winCount(x,y,dx,dy,p)<2)return 0;
  const op=3-p;let s=0;
  for(let o=-4;o<=0;o++){            /* 窗口起点：窗口覆盖 (x,y) */
    let k=0,mn=5,mx=-5,ok=true;
    for(let t=o;t<o+5;t++){
      const nx=x+dx*t,ny=y+dy*t;
      if(!inB(nx,ny)){ok=false;break;}
      const v=board[nx][ny];
      if(v===op){ok=false;break;}
      if(v===p){k++;if(t<mn)mn=t;if(t>mx)mx=t;}
    }
    if(!ok||k<3||mx-mn+1===k)continue;   /* 对方挡住 / 子数不足 / 连续（已由 dirScore 计入） */
    s+=k===4?SPLIT4:SPLIT3;
  }
  return s;
}
function stoneScore(x,y,p){
  let s=0;
  for(const d of DIRS){
    const r=runInfo(x,y,d[0],d[1],p);
    s+=dirScore(r[0],r[1],p)+splitScore(x,y,d[0],d[1],p);
  }
  return s;
}
/* 模拟 p 落在 (x,y) 后的形态分（自动还原） */
function evalPoint(x,y,p){
  const old=board[x][y];board[x][y]=p;const s=stoneScore(x,y,p);board[x][y]=old;return s;
}
/* 连珠胜负：黑棋必须恰好五连（长连为禁手），白棋五连及以上均获胜 */
function isWinRun(x,y,p){
  for(const d of DIRS){
    const r=runInfo(x,y,d[0],d[1],p)[0];
    if(p===BLACK?r===5:r>=5)return true;
  }
  return false;
}
/* 返回获胜的那组棋子坐标，未获胜返回 null（side-aware：黑棋只认恰好五连） */
function winCellsAt(x,y,p){
  for(const d of DIRS){
    const dx=d[0],dy=d[1];
    const r=runInfo(x,y,dx,dy,p)[0];
    const isWin=p===BLACK?r===5:r>=5;
    if(!isWin)continue;
    const cells=[[x,y]];
    let i=1,nx,ny;
    while(inB(nx=x+dx*i,ny=y+dy*i)&&board[nx][ny]===p){cells.push([nx,ny]);i++;}
    i=1;
    while(inB(nx=x-dx*i,ny=y-dy*i)&&board[nx][ny]===p){cells.unshift([nx,ny]);i++;}
    return cells;
  }
  return null;
}
/* ============ 连珠禁手检测（仅黑棋受约束） ============ */
/* 沿 (dx,dy) 偏移 o 处的目标，是否与 (x,y) 之间只隔着黑子（保证新形由落子参与形成） */
function linkedTo(x,y,dx,dy,o,p){
  const s=Math.sign(o);
  for(let t=1;t<Math.abs(o);t++){
    if(board[x+dx*s*t][y+dy*s*t]!==p)return false;
  }
  return true;
}
/* 沿方向 (dx,dy) 统计：多少个空位补上 p 色子后能形成「经过 (x,y) 的取胜连子」
   （黑棋要求恰好5连，白棋5连及以上）。
   ===== 补点唯一性（本文件多处复用的关键变换）=====
   原实现枚举 o=-4..4 的 8 个偏移，逐个做 linkedTo（中间格必须全为己方子）与空位检查。
   但「中间全为己方子 + 该格为空」两条同时成立时偏移是唯一的：
   设正向连子长 R、负向连子长 L（lrInfo），则正侧只有 o=R+1 可能成立
   （o≤R 落在连子上非空；o≥R+2 的中途 o=R+1 格为空），负侧同理只有 o=-(L+1)。
   故只需检查至多 2 个候选点，结果与原枚举逐位相同（还需 |o|≤4 与在盘内）。 */
function ptsToFiveThrough(x,y,dx,dy,p){
  let cnt=0;
  const lr=lrInfo(x,y,dx,dy,p);
  const L=lr[0],R=lr[1];        /* LR 是复用数组：循环内的嵌套调用会改写它 */
  for(let s=0;s<2;s++){
    const o=s?-(L+1):(R+1);
    if(o<-4||o>4)continue;
    const nx=x+dx*o,ny=y+dy*o;
    if(!inB(nx,ny)||board[nx][ny]!==EMPTY)continue;
    board[nx][ny]=p;
    const r=runInfo(x,y,dx,dy,p)[0];
    board[nx][ny]=EMPTY;
    if(p===BLACK?r===5:r>=5)cnt++;
  }
  return cnt;
}
function ptsToExactlyFiveThrough(x,y,dx,dy){return ptsToFiveThrough(x,y,dx,dy,BLACK);}
/* 四的数量不等于成五点数，也不等于方向数。
   两个成五点：连续四是同一组四子，否则是同线两个不同的四（如 X.XXX.X）。
   补点唯一性保证经过本子的成五点至多两个，故不必为热路径分配棋子集合。 */
function fourCountDir(x,y,dx,dy){
  const n=ptsToExactlyFiveThrough(x,y,dx,dy);
  return n===2&&runInfo(x,y,dx,dy,BLACK)[0]===4?1:n;
}
/* RIF 3 / 9.3：三必须能延伸为直四，且不能同时成五、长连、四四或禁三三。
   不可用固定递归层数代替规则：每层新增一颗黑子，空点严格减少，递归自然终止。
   WC 由调用方同步；在整个递归返回前不能撤销祖先的试落子。 */
function blackExtensionLegal(qx,qy,depth){
  return blackMoveType(qx,qy,(depth|0)+1)==='ok';
}
/* 该方向上是否存在「活三」：存在相连空点 q，补黑后形成以 (x,y) 参与的双头活四，
   且该延伸点自身不是禁手。
   候选空点同样由补点唯一性收窄到至多 2 个（正侧 R+1、负侧 -(L+1)），与全枚举等价。 */
function isFreeThreeDir(x,y,dx,dy,depth){
  const lr=lrInfo(x,y,dx,dy,BLACK);
  const L=lr[0],R=lr[1];        /* LR 是复用数组：循环内的嵌套调用会改写它 */
  for(let s=0;s<2;s++){
    const o=s?-(L+1):(R+1);
    if(o<-4||o>4)continue;
    const nx=x+dx*o,ny=y+dy*o;
    if(!inB(nx,ny)||board[nx][ny]!==EMPTY)continue;
    wcTemp(nx,ny,BLACK);         /* 同 blackLegality：嵌套判定会在别处查 WC 表 */
    const open4=runInfo(x,y,dx,dy,BLACK)[0]===4
      &&ptsToExactlyFiveThrough(x,y,dx,dy)===2 /* 必须是直四，不是同线双四 */
      &&blackExtensionLegal(nx,ny,depth);
    wcUntemp(nx,ny,BLACK);
    if(open4)return true;
  }
  return false;
}
/* 沿 (dx,dy) 距 (x,y) 四格以内的同色子数（隔着空位也计入，中心 (x,y) 不计）。
   过点 (x,y) 成「四」= 再补一子成五，那五点必在 ±4 窗口内 ⇒ 除新子外至少还要 3 子；
   成「活三」= 补一子成双头四 ⇒ 至少还要 2 子。故它是这两个形态的下界筛：
   计数不足即可断定该方向既无四亦无三，判定结果与原穷举完全一致，只是便宜得多。 */
function winCount(x,y,dx,dy,p){
  /* 查 WC 表（setCell 增量维护）：同一语义，O(1)。方向先归一化到四个规范方向，
     (±1,0)/(0,±1)/(±1,±1)/(±1,∓1) 都映射到同一条线，非规范方向不会被调用。 */
  if(dx<0||(dx===0&&dy<0)){dx=-dx;dy=-dy;}
  const t=dx===1?(dy===0?WC[0]:(dy===1?WC[2]:WC[3])):WC[1];
  return t[(p===BLACK?0:WN)+x*N+y];
}
/* 「补一子成五」的必要条件下界：某方向 ±4 内已有 ≥4 个同色子（查 WC 表，O(1)）。
   成五点必落在含该点的某个 5 格窗内，故 4 个己方子都在 ±4 内 ⇒ 为真必要条件。
   用于取胜点扫描的剪枝：中盘绝大多数候选点四个方向都凑不出 4 子。 */
function canFive(x,y,p){
  const i=(p===BLACK?0:WN)+x*N+y;
  return WC[0][i]>=4||WC[1][i]>=4||WC[2][i]>=4||WC[3][i]>=4;
}
/* 黑棋落子禁手判定。调用前需已将黑子临时放在 (x,y)。
   返回 'win'（合法五连）/ 'overline'（长连）/ '44'（四四）/ '33'（三三）/ 'ok' */
function blackMoveType(x,y,depth){
  depth=depth|0;
  let overline=false,five=false,p4=0,p3=0,sameLine44=false;
  const pot=[0,0,0,0];
  for(let i=0;i<4;i++){
    const dx=DIRS[i][0],dy=DIRS[i][1];
    const r=runInfo(x,y,dx,dy,BLACK)[0];
    if(r>=6)overline=true;
    else if(r===5)five=true;
    const w=winCount(x,y,dx,dy,BLACK);
    pot[i]=w;
    if(w>=4)sameLine44=true; /* 同线双四的两组四子并集至少五子 */
    if(w>=3)p4++;
    if(w>=2)p3++;
  }
  if(five)return 'win';        /* RIF：五连优先于一切禁手（含长连） */
  if(overline)return 'overline';
  /* 本文件最大的热点：原版对每个候选点都要做全窗枚举（占单手可用时长的近一半），
     而绝大多数点根本没有可能在两个方向上同时成四或成三。 */
  if(p4<2&&p3<2&&!sameLine44)return 'ok';
  let fours=0,threes=0;
  let fourDirs=0;
  /* 先查全部四，再查三；不仅避免漏掉同线四四，也免去已是四四时的递归。 */
  for(let i=0;i<4;i++){
    if(pot[i]<3)continue;
    const n=fourCountDir(x,y,DIRS[i][0],DIRS[i][1]);
    if(n)fourDirs|=1<<i;
    fours+=n;
    if(fours>=2)return '44';
  }
  if(p3<2)return 'ok';
  for(let i=0;i<4;i++){
    if(!(fourDirs&(1<<i))&&pot[i]>=2&&isFreeThreeDir(x,y,DIRS[i][0],DIRS[i][1],depth)){
      if(++threes>=2)return '33';
    }
  }
  return 'ok';
}
/* 便捷封装：内部完成临时落子/撤子。
   注意不能用裸写格：禁手判定会经由 isFreeThreeDir→blackExtensionLegal 再往下问
   winCount()，那些查询点不是本格，WC 表必须把这一颗临时子也算进去。 */
function blackLegality(x,y){
  /* 只对空点判定。wcTemp 会真的把这一颗临时子写进 board，wcUntemp 之后又把该点
     写成 EMPTY——若对已占点调用，原有棋子会被抹掉，且 Zobrist 哈希不会同步回退，
     哈希与盘面从此不一致。这里显式拒绝非空点（返回值与旧行为一致：仍为 'ok'）。 */
  if(!inB(x,y)||board[x][y]!==EMPTY)return 'ok';
  wcTemp(x,y,BLACK);
  const t=blackMoveType(x,y);
  wcUntemp(x,y,BLACK);
  return t;
}
/* AI 落子不变量：只能返回空点；黑棋只能返回经禁手检测的合法着法 */
function isLegalMoveAt(p,x,y){
  if(!inB(x,y)||board[x][y]!==EMPTY)return false;
  if(p!==BLACK)return true;
  const t=blackLegality(x,y);
  return t==='ok'||t==='win';
}
function legalCandidatePoints(p,points){
  const legal=[];
  for(const c of points){
    if(isLegalMoveAt(p,c[0],c[1]))legal.push(c);
  }
  return legal;
}
/* ============ 战术搜索组件：取胜点集 / 冲四着法 / VCF静默扩展 ============ */
/* 与现有 blackMoveType / isWinRun 保持同一胜负语义：有恰五即胜，
   即使另一方向同时长连；只有长连、没有恰五时不算胜。这里只用于 AI 取胜点扫描。 */
function blackWinAt(x,y){return isWinRun(x,y,BLACK);}
/* 一次候选扫描同时求出双方的一手取胜点：qNode 每个结点都要问两边，
   分开扫等于把整轮形态计算做两遍。调用方只需区分 0 / 1 / ≥2，故各集计到 2 个即停。 */
function winPointsBoth(p){
  const op=3-p,mine=[],opp=[];
  for(const c of candidates(1)){
    const x=c[0],y=c[1];
    if(board[x][y]!==EMPTY)continue;
    /* 成五下界筛排除不可能的点；每侧凑够两个胜点后停止该侧试落，
       即使另一侧还没凑够，也不重复统计已有双杀的一侧。各侧只保留行序前两点。 */
    const canP=mine.length<2&&canFive(x,y,p),canO=opp.length<2&&canFive(x,y,op);
    if(!canP&&!canO)continue;
    if(canP){
      if(p===BLACK){
        board[x][y]=BLACK;
        if(blackWinAt(x,y))mine.push({x:x,y:y});
        board[x][y]=EMPTY;
      }else{
        board[x][y]=WHITE;
        if(isWinRun(x,y,WHITE))mine.push({x:x,y:y});
        board[x][y]=EMPTY;
      }
    }
    if(canO){
      if(op===BLACK){
        board[x][y]=BLACK;
        if(blackWinAt(x,y))opp.push({x:x,y:y});
        board[x][y]=EMPTY;
      }else{
        board[x][y]=WHITE;
        if(isWinRun(x,y,WHITE))opp.push({x:x,y:y});
        board[x][y]=EMPTY;
      }
    }
    if(mine.length>=2&&opp.length>=2)break;
  }
  return {mine:mine,opp:opp};
}
/* p 方当前的一步取胜点（黑棋只含合法恰好五连；至多两个已足够）。
   单侧扫描版：与 winPointsBoth(p).mine 逐点一致（同为行序最先的至多两个），但只问一侧时
   不必替对面也算一遍——negamax 的强制应着判定、VCT 的 vctA/vctD 每个结点都要单侧问一次，
   分开算等于把整轮形态计算做两遍。 */
function winPointsOne(p){
  const out=[];
  for(const c of candidates(1)){
    if(board[c[0]][c[1]]!==EMPTY)continue;
    if(!canFive(c[0],c[1],p))continue;      /* 成五下界筛，见 winPointsBoth */
    board[c[0]][c[1]]=p;
    const hit=p===BLACK?blackWinAt(c[0],c[1]):isWinRun(c[0],c[1],p);
    board[c[0]][c[1]]=EMPTY;
    if(hit){out.push({x:c[0],y:c[1]});if(out.length>=2)break;}
  }
  return out;
}
function winPointsAll(p){
  return winPointsOne(p);
}
/* p 方的「冲四着」：落下后产生至少一个方向可在下一手取胜（黑方只含合法着法） */
function fourMoves(p,cap){
  const cands=candidates(2),out=[];
  for(const c of cands){
    if(board[c[0]][c[1]]!==EMPTY)continue;
    /* 与 winCount 同一个下界筛子：兵力凑不出「补一子成五」的点不可能是冲四着法，

      if(e.f===0)return ev;
      if(e.f===1&&ev<=alpha)return ev;
      if(e.f===2&&ev>=beta)return ev;
    }
    if(e.m)ttMove=e.m;            /* 深度不够时只借用它记录的最佳着法 */
  }
  if(depth<=0)return qNode(p,alpha,beta,VCF_PLY,wpb);
  /* 强制应着：对方已有一步成五点时只能堵这一点；两个成五点则必败；堵点为黑方禁手亦必败 */
  let moves;
  const threats=wpb.opp;
  if(threats.length>=2)return -9000000-depth*1000;
  if(threats.length===1){
    const b=threats[0];
    if(!isLegalMoveAt(p,b.x,b.y))return -9000000-depth*1000;
    moves=[{x:b.x,y:b.y}];
  }else{
    moves=orderedMoves(p,depth>=3?12:10);
    if(ttMove){                   /* 上一层的 PV 先搜，剪枝才能尽早命中 */
      for(let i=1;i<moves.length;i++){
        if(moves[i].x===ttMove[0]&&moves[i].y===ttMove[1]){moves.unshift(moves.splice(i,1)[0]);break;}
      }
    }
    if(KILL_ON&&moves.length>2){  /* ⑲-c 杀手着法紧随 TT 着法之后 */
      for(let s=0;s<2;s++){
        const km=searchPly<128?KILL[searchPly*2+s]:-1;
        if(km<0)continue;
        for(let q=2+s;q<moves.length;q++){
          if(moves[q].x*16+moves[q].y===km){const h=moves[1+s];moves[1+s]=moves[q];moves[q]=h;break;}
        }
      }
    }
  }
  if(!moves.length)return -9000000-depth*1000; /* orderedMoves 已全盘扫描：无合法着法即判负（满盘已在上方返回和棋） */
  let best=-Infinity,bx=-1,by=-1,pv=true;
  for(const m of moves){
    pushStone(m.x,m.y,p);
    searchPly++;
    let v;
    /* PVS：主变首着全窗定标尺；其余着法先零窗试探，证明可能更好才全窗复核，剪枝只多不少 */
    if(pv){
      v=-negamax(depth-1,-beta,-alpha,3-p,m.x,m.y);
      pv=false;
    }else{
      v=-negamax(depth-1,-alpha-1,-alpha,3-p,m.x,m.y);
      if(!searchAborted&&v>alpha&&v<beta)v=-negamax(depth-1,-beta,-alpha,3-p,m.x,m.y);
    }
    searchPly--;
    pushStone(m.x,m.y,EMPTY);
    /* 先完整撤销，再沿调用栈退出；不搜兄弟、不更新 killer/TT。
       此返回值只是占位，根节点会丢弃本轮未完成结果。 */
    if(searchAborted)return 0;
    if(v>best){best=v;bx=m.x;by=m.y;}
    if(v>alpha)alpha=v;
    if(alpha>=beta){
      if(KILL_ON&&bx>=0&&searchPly<128){const k=bx*16+by,i2=searchPly*2;if(KILL[i2]!==k){KILL[i2+1]=KILL[i2];KILL[i2]=k;}}
      break;
    }
  }
  if(searchAborted)return best;   /* 被时间截断的半截结果不写表，否则会污染同代其它结点 */
  /* 胜负分不入表：qNode 返回的胜负分为 ±(9000000+qd*10)，并不携带 negamax 的 depth*1000 约定；
     ttIn/ttOut 按 depth 归一化会使其取回时漂移 ±1000 的整数倍（实测：同一局面复用表后白方被杀线
     分值从 -9000080 变为 -8999090，导致根节点在多条必输着法间的排序错误）。
     胜负分局面重搜代价很小，直接不缓存即可保证结果与表的内容无关。 */
  if(Math.abs(best)>8900000)return best;
  if(!TT_DEPTH_PREF){
    TT[ti]={k1,k2,dn:ttDraft,d:depth,v:ttIn(best,depth),f:best<=a0?1:(best>=beta?2:0),m:[bx,by]};
  }else{
    /* ⑲-d 深度优先替换：碰撞槽里不同局面的更深条目优先保留——
       无条件覆盖会让一次浅层搜索挤掉迭代加深最想复用的深层结果。 */
    const old=TT[ti];
    if(!old||(old.k1===k1&&old.k2===k2)||old.dn!==ttDraft||old.d<=depth)
      TT[ti]={k1,k2,dn:ttDraft,d:depth,v:ttIn(best,depth),f:best<=a0?1:(best>=beta?2:0),m:[bx,by]};
  }
  return best;
}
/* 送杀闸门只凭 VCF 强制线否决着法，不凭近似 VCT 的阳性结果。
   GUARD_DEPTH 次攻防约为 2*GUARD_DEPTH 个 ply；冲四候选截宽只可能漏杀，
   不会像截断 VCT 防守集合那样把未检查的反击当作无解。未检出不代表已经证明安全。 */
function guardSafe(p,mv,ms){
  const oldDeadline=searchDeadline,oldAborted=searchAborted,oldNodes=qNodes;
  pushStone(mv.x,mv.y,p);
  try{
    if(isWinRun(mv.x,mv.y,p))return true;
    searchDeadline=Date.now()+ms;searchAborted=false;
    const score=qNode(3-p,-Infinity,Infinity,GUARD_DEPTH*2);
    return searchAborted||Date.now()>searchDeadline||score<8900000;
  }finally{
    pushStone(mv.x,mv.y,EMPTY);
    searchDeadline=oldDeadline;searchAborted=oldAborted;qNodes=oldNodes;
  }
}
/* 在 root（当前最优次序）里找第一手无送杀嫌疑的着法；全灭或超时返回 null */
function guardBest(p,root,deadline){
  let rest=root.length;
  for(const m of root){
    let ms=deadline-Date.now();
    if(ms<8)break;
    ms=Math.min(ms,Math.max(8,ms/rest));
    rest--;
    if(guardSafe(p,m,ms))return m;
  }
  return null;
}
/* AI 选择着点（内部实现）。p 为 AI 执子（黑方着法自动经过禁手过滤） */
function stonesOnBoard(){return boardStones;}
function aiChooseRaw(p){
  const op=3-p;
  let vctWin=null;
  vctBreakers=null;                          /* 提示只在本手有效 */
  const tStart=Date.now();                       /* 本手计时起点：VCT 与迭代加深共用同一时限 */
  const cands=candidates(2);
  if(!cands.length)return null;
  /* 能赢先赢 */
  const wp=p===WHITE?fivePoint(WHITE):blackWinPoint();
  if(wp)return wp;
  /* 中等及以上：不允许随机放弃唯一的合法必挡点（活四/双杀无法单挡时除外） */
  if(mode!=='ai-easy'){
    const opWins=winPointsAll(op);
    if(opWins.length===1&&isLegalMoveAt(p,opWins[0].x,opWins[0].y))return opWins[0];
  }
  /* 困难及专家：VCT 给出攻击/防守提示，统一交给主搜索验证，而非直接认定必胜。 */
  if(VCT_ENABLED&&(mode==='ai-hard'||mode==='ai-expert')){
    const vcfg=AI_CFG[mode];
    syncCand();
    vctDeadline=tStart+vcfg.t*VCT_SHARE;
    vctAborted=false;
    const vw=vctFindWin(p);
    if(!vctAborted&&vw&&isLegalMoveAt(p,vw.x,vw.y))vctWin=vw;
    if(!vctWin&&!vctAborted){
      vctBreakers=vctDefend(p);
    }
    vctAborted=false;
  }
  if(mode==='ai-easy'){
    /* 对方成五点必挡；双杀点任堵其一（守不住也挣扎一下） */
    const ow=winPointsAll(op);
    if(ow.length===1&&isLegalMoveAt(p,ow[0].x,ow[0].y))return ow[0];
    if(ow.length>=2){
      const b=ow.filter(w=>isLegalMoveAt(p,w.x,w.y));
      if(b.length)return b[(Math.random()*b.length)|0];
    }
    /* 静态分加权落子：攻方估价+守方估价的八成，越强的点越容易被选中，但并不保证 */
    let near=legalCandidatePoints(p,candidates(1));
    if(!near.length)near=legalCandidatePoints(p,candidates(2));
    if(!near.length){
      const fb=orderedMoves(p,8);
      if(!fb.length)return null;
      return fb[(Math.random()*fb.length)|0];
    }
    const sc=near.map(c=>({x:c[0],y:c[1],s:evalPoint(c[0],c[1],p)+evalPoint(c[0],c[1],op)*0.8}));
    sc.sort((a,b)=>b.s-a.s||((a.x*16+a.y)-(b.x*16+b.y)));
    const r=Math.random();
    if(r<0.55)return sc[0];
    if(sc.length>1&&r<0.80)return sc[1];
    if(sc.length>2&&r<0.92)return sc[2];
    return sc[(Math.random()*sc.length)|0];
  }
  if(mode==='ai-medium'){
    const ranked=orderedMoves(p,8);
    if(!ranked.length)return null;
    const r=Math.random();
    let idx=0;
    if(r>=0.7&&r<0.9)idx=Math.min(1,ranked.length-1);
    else if(r>=0.9)idx=Math.min(ranked.length-1,1+((Math.random()*3)|0));
    return ranked[idx];
  }
  /* 迭代加深：先 2 层跑一遍完整结果打底，再逐层加深，剩余时间不足以跑完整层就收手。
     原版只搜固定深度，一旦超时就把「只看了前几手」的半截评估当作结论交出，
     而专家又几乎没用到 3 秒预算。 */
  const cfg=AI_CFG[mode]||AI_CFG['ai-hard'];
  const budget=cfg.t;
  searchDeadline=tStart+budget-(VCF_GUARD?GUARD_MS:0); /* 时限自 tStart 起算，已扣除 VCT 与送杀闸门用时 */
  searchAborted=false;
  zobristInit();
  hashFromBoard();
  ttDraft++;
  qNodes=0;
  let root=orderedMoves(p,cfg.w);
  const staticBest=root[0];                    /* 首层超时时，不把未验证的提示当作最优 */
  const hints=[...(vctWin?[vctWin]:[]),...(vctBreakers||[])];
  if(hints.length){
    const seen=new Set();
    /* 合法提示前置、去重；静态候选一个不删。宽度外提示额外加入（至多两个）。 */
    root=[...hints.filter(m=>isLegalMoveAt(p,m.x,m.y)),...root].filter(m=>{
      const k=m.x*N+m.y;if(seen.has(k))return false;seen.add(k);return true;
    });
  }
  vctBreakers=null;
  if(!root.length)return null;
  if(root.length===1)return {x:root[0].x,y:root[0].y};
  let best=staticBest||root[0],bestV=-Infinity;
  /* P1 开局多样性：≤8 子时根节点改用全窗口逐手精确打分，末层分值接近者入池随机——
     老版本的同分随机从未触发过（每层都有严格唯一最优），Expert 开局是一套固定谱。 */
  const OPENING=stonesOnBoard()<8;let openScores=null;
  for(const depth of cfg.d){
    if(depth>2&&searchDeadline-Date.now()<budget*0.15)break;
    let cur=null,curV=-Infinity,n=0,rootAlpha=-Infinity;
    let ties=[];                              /* 并列最优着法：同分时随机选，避免相同局面每局都走同一步 */
    const scored=[];
    for(const m of root){
      pushStone(m.x,m.y,p);
      /* 根节点窗口：只需判断能否超过当前最好值，子搜索上界取 -rootAlpha */
      searchPly=1;
      const v=isWinRun(m.x,m.y,p)?9000000:-negamax(depth-1,-Infinity,OPENING?Infinity:-rootAlpha,op,m.x,m.y);
      searchPly=0;
      pushStone(m.x,m.y,EMPTY);
      if(searchAborted)break;     /* 被时限截断的那一手，数值来自未搜完的子树，不计入本层 */
      scored.push([v,m]);n++;
      if(v>curV){curV=v;cur=m;ties=[m];}
      else if(v===curV)ties.push(m);
      if(v>rootAlpha)rootAlpha=v;
    }
    /* ties[0] 是严格刷新 curV 的那手，必为精确分；其余并列者可能只拿到了根窗口的上界值，
       随机前先用全窗口复核，剔除“形似同分实则更差”的着法，再在真同分中随机 */
    if(cur&&ties.length>1&&!searchAborted){
      if(OPENING){
        cur=ties[(Math.random()*ties.length)|0];
      }else{
        const pool=[ties[0]];
        for(let i=1;i<ties.length;i++){
          if(searchDeadline-Date.now()<50)break;    /* 接近尾声就不再开启复查 */
          const m=ties[i];
          pushStone(m.x,m.y,p);
          searchPly=1;
          const ev=isWinRun(m.x,m.y,p)?9000000:-negamax(depth-1,-Infinity,Infinity,op,m.x,m.y);
          searchPly=0;
          pushStone(m.x,m.y,EMPTY);
          if(!searchAborted&&ev===curV)pool.push(m);
        }
        if(pool.length>1)cur=pool[(Math.random()*pool.length)|0];
      }
    }
    /* 不同深度的分数不可直接比较。只有全部根着搜索完成才提交；
       首层也没完成时，保留已经过合法性过滤的静态首选作为兜底。
       同分复核超时不影响主循环已经完成的精确最优着。 */
    if(cur&&n===root.length){best=cur;bestV=curV;if(OPENING&&!searchAborted)openScores=scored;}
    if(searchAborted||bestV>=8900000)break;   /* 已算出必杀，把时间还给玩家 */
    scored.sort((a,b)=>b[0]-a[0]);
    root=scored.map(s=>s[1]);                 /* 用本层评估序作为下一层的搜索次序 */
  }
  /* 开局随机：末层全窗精确分不劣于 bestV-1200 的一并入池随机。EPS 取断三（3000）一档之下，
     只交换等价/近等价开局着，不跨形档降强度；送杀闸门仍在更后面兜底。 */
  if(OPENING&&openScores&&bestV<8900000){
    const pool=openScores.filter(s=>s[0]>=bestV-1200).map(s=>s[1]);
    if(pool.length>1)best=pool[(Math.random()*pool.length)|0];
  }
  if(VCF_GUARD&&best&&bestV<8900000){
    /* 送杀检查：最优着若把对手可证明的强制杀放上了棋盘，顺延到首个安全候选；
       全部候选都走杀（或没时间复核）时维持原手。
       不再因 searchAborted 跳过：时限已给闸门预留 GUARD_MS，够不够由下面的 left 判断——
       加深档被截断是常态，若因此弃检，尾档越深反而越容易漏掉送杀。 */
    const left=tStart+budget-Date.now();
    if(left>=30){
      /* 闸门只能否决当前最佳着，不能因旧排序或随机同分而擅自换着。 */
      const guardRoot=[best,...root.filter(m=>m.x!==best.x||m.y!==best.y)];
      const keep=guardBest(p,guardRoot,Date.now()+Math.min(left,GUARD_MS*3));
      if(keep)best=keep;
    }
  }
  return {x:best.x,y:best.y};
}
/* 最后一道防线：无论各难度策略以后如何演化，绝不向对局流程交付禁手点 */
function aiChoose(p){
  syncCand(); /* 对局流程/读档可能整体替换或直写 board，思考前与盘面校准一次 */
  const move=aiChooseRaw(p);
  if(move&&isLegalMoveAt(p,move.x,move.y))return move;
  const fallback=orderedMoves(p,12);
  return fallback.length?{x:fallback[0].x,y:fallback[0].y}:null;
}

}
function geom(){const m=CW*0.062;return{s:CW,m,g:(CW-2*m)/(N-1),r:(CW-2*m)/(N-1)*0.44};}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function scheduleDraw(){
  if(drawQueued)return;
  drawQueued=true;
  requestAnimationFrame(()=>{drawQueued=false;drawBoard();});
}
function drawStone(cx,cy,r,p,alpha){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.shadowColor='rgba(0,0,0,.32)';ctx.shadowBlur=r*0.32;ctx.shadowOffsetY=r*0.1;
  const gr=ctx.createRadialGradient(cx-r*0.36,cy-r*0.42,r*0.12,cx,cy,r);
  if(p===BLACK){gr.addColorStop(0,pal.sBA);gr.addColorStop(1,pal.sBB);}
  else{gr.addColorStop(0,pal.sWA);gr.addColorStop(1,pal.sWB);}
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();
  ctx.restore();
  if(p===WHITE){ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle=pal.sWS;ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,r-0.5,0,Math.PI*2);ctx.stroke();ctx.restore();}
}
function drawBoard(){
  if(!CW||!pal.board)return;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  if(canvas.width!==Math.round(CW*dpr)){canvas.width=Math.round(CW*dpr);canvas.height=Math.round(CW*dpr);}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const G=geom(),s=G.s,m=G.m,g=G.g,rr=G.r;
  ctx.clearRect(0,0,s,s);
  /* 棋盘底 */
  roundRect(ctx,0,0,s,s,s*0.05);
  ctx.fillStyle=pal.board;ctx.fill();
  /* 网格 */
  ctx.strokeStyle=pal.line;ctx.lineWidth=Math.max(1,s*0.0017);ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<N;i++){
    ctx.moveTo(m,m+i*g);ctx.lineTo(s-m,m+i*g);
    ctx.moveTo(m+i*g,m);ctx.lineTo(m+i*g,s-m);
  }
  ctx.stroke();
  /* 星位 */
  ctx.fillStyle=pal.lineStrong;
  for(const st of [[3,3],[11,3],[3,11],[11,11],[7,7]]){
    ctx.beginPath();ctx.arc(m+st[0]*g,m+st[1]*g,Math.max(1.6,g*0.085),0,Math.PI*2);ctx.fill();
  }
  /* 禁手点标记：轮到黑棋时把禁手点以 × 标出 */
  if(foulSet.size&&!over){
    ctx.save();
    ctx.strokeStyle=pal.primary;ctx.globalAlpha=0.62;
    ctx.lineWidth=Math.max(1.6,g*0.05);ctx.lineCap='round';
    const fr=g*0.18;
    for(const key of foulSet){
      const fx=key>>4,fy=key&15;
      const cx=m+fx*g,cy=m+fy*g;
      ctx.beginPath();
      ctx.moveTo(cx-fr,cy-fr);ctx.lineTo(cx+fr,cy+fr);
      ctx.moveTo(cx+fr,cy-fr);ctx.lineTo(cx-fr,cy+fr);
      ctx.stroke();
    }
    ctx.restore();
  }
  const now=performance.now();
  /* 悬浮 Ghost */
  const ghostOK=hover&&!over&&board[hover.x][hover.y]===EMPTY&&!aiThinking&&(mode==='pvp'||turn===humanP)&&!(turn===BLACK&&foulSet.has(hover.x*16+hover.y));
  if(ghostOK)drawStone(m+hover.x*g,m+hover.y*g,rr,turn,0.42);
  /* 键盘光标 */
  if(kbdCursor&&!over){
    ctx.save();
    ctx.strokeStyle=pal.primary;ctx.lineWidth=2;ctx.setLineDash([5,4]);
    ctx.beginPath();ctx.arc(m+cursor.x*g,m+cursor.y*g,rr*1.2,0,Math.PI*2);ctx.stroke();
    ctx.restore();
    if(!ghostOK&&board[cursor.x][cursor.y]===EMPTY&&!aiThinking&&(mode==='pvp'||turn===humanP)&&!(turn===BLACK&&foulSet.has(cursor.x*16+cursor.y)))
      drawStone(m+cursor.x*g,m+cursor.y*g,rr,turn,0.42);
  }
  /* 棋子（最后一手带落子动画） */
  const last=history[history.length-1];
  const animT=last?Math.min(1,(now-last.at)/150):1;
  for(const mv of history){
    let scale=1;
    if(mv===last&&animT<1){const t=animT;scale=1+0.5*(1-t)*(1-t);}
    drawStone(m+mv.x*g,m+mv.y*g,rr*scale,mv.p,1);
  }
  /* 最后一手标记：主题强调色（黑棋上用亮色阶、白棋上用深色阶保证对比） */
  if(last){
    ctx.fillStyle=last.p===BLACK?pal.acc:pal.deep;
    ctx.beginPath();ctx.arc(m+last.x*g,m+last.y*g,Math.max(2.2,rr*0.22),0,Math.PI*2);ctx.fill();
  }
  /* 获胜连线 */
  if(winCells&&winCells.length){
    const a=winCells[0],b=winCells[winCells.length-1];
    ctx.save();
    ctx.strokeStyle=pal.primary;ctx.globalAlpha=0.85;ctx.lineWidth=Math.max(3,g*0.13);ctx.lineCap='round';
    ctx.shadowColor=pal.primary;ctx.shadowBlur=14;
    ctx.beginPath();ctx.moveTo(m+a[0]*g,m+a[1]*g);ctx.lineTo(m+b[0]*g,m+b[1]*g);ctx.stroke();
    ctx.restore();
  }
  if(last&&animT<1)scheduleDraw();
}

/* ================= 布局自适应 ================= */
function fitBoard(){
  let side;
  if(window.innerWidth>=960){
    const r=wrap.getBoundingClientRect();
    side=Math.min(r.width,r.height);
  }else{
    /* 单栏布局再以视口高度封顶：横屏手机上只按宽度取边长，棋盘会比屏幕高出一倍，必须来回滚动才能看全 */
    side=Math.min(wrap.clientWidth,document.documentElement.clientHeight-24);
  }
  side=Math.max(240,Math.min(side,880));
  if(Math.abs(side-CW)>1){
    CW=side;
    canvas.style.width=side+'px';canvas.style.height=side+'px';
  }
  scheduleDraw();
}
let rszT=null;
window.addEventListener('resize',()=>{clearTimeout(rszT);rszT=setTimeout(fitBoard,60);});
window.addEventListener('orientationchange',()=>setTimeout(fitBoard,120));
window.addEventListener('beforeunload',()=>{if(history.length)saveSession();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&history.length)saveSession();});

/* ================= 计时 ================= */
function fmt(t){
  const h=(t/3600)|0,mm=((t%3600)/60)|0,ss=t%60;
  const p=v=>String(v).padStart(2,'0');
  return h>0?h+':'+p(mm)+':'+p(ss):p(mm)+':'+p(ss);
}
/* 按墙钟时间计时：旧实现每次 tick 加 1 秒，标签页在后台被节流（Chrome 久置后约每分钟才触发一次）
   会少算大量时间。改为累加相邻两次同步之间的墙钟间隔，并做两处保护：
   时钟回拨（间隔为负）记 0，不会停表；单次间隔最多记 5 分钟，设备休眠或标签页长期后台不计入对局用时。 */
const TIMER_GAP_CAP=300000;
function syncElapsed(){
  if(!timerRunning)return;
  const now=Date.now();
  timerFrac+=Math.min(Math.max(0,now-timerLast),TIMER_GAP_CAP);
  timerLast=now;
  if(timerFrac>=1000){const sec=Math.floor(timerFrac/1000);elapsed+=sec;timerFrac-=sec*1000;}
}
function startTimer(){
  if(timerRunning)return;
  timerRunning=true;
  timerLast=Date.now();
  timerId=setInterval(()=>{syncElapsed();$('timer').textContent=fmt(elapsed);},250);
}
function stopTimer(){
  syncElapsed();
  timerRunning=false;clearInterval(timerId);
  $('timer').textContent=fmt(elapsed);
}

/* ================= HUD ================= */
/* 屏幕阅读器状态播报：canvas 本身不提供棋盘语义，用 aria-live 区域
   逐手播报坐标、手数、轮次、禁手拒绝、悔棋与终局。 */
const LETTERS='ABCDEFGHJKLMNOP';          /* 列坐标跳过 I，与围棋记谱一致 */
/* 记谱惯例：列为 A–P（跳过 I），行号自棋盘底部向上数，与 RIF 记谱一致 */
const coordLabel=(x,y)=>(LETTERS[x]||'?')+(N-y);
const sideName=p=>p===BLACK?'黑棋':'白棋';
let announceTid=0;
const announceBuf=[];
function announce(msg){
  const el=$('a11yStatus');if(!el)return;
  /* 30ms 内的多条消息合并成一句播报。旧实现用 clearTimeout 覆盖，
     会把前一条直接丢掉（例如点「我执白」后 newGame 的播报会被 AI 首手挤掉）。 */
  if(announceBuf[announceBuf.length-1]!==msg)announceBuf.push(msg);
  if(announceTid)return;
  const flush=()=>{
    announceTid=0;
    const text=announceBuf.splice(0).join(' ');
    el.textContent='';
    /* 先清空再下一帧写入：部分读屏器不会重复播报完全相同的文本 */
    requestAnimationFrame(()=>{el.textContent=text;});
  };
  announceTid=setTimeout(flush,30);
}
/* 白棋长连也算胜；黑棋长连是禁手，只可能恰五取胜 */
const winPhrase=p=>p===WHITE?'连成五子或长连':'连成五子';
function announceMove(x,y,p){
  const who=sideName(p),at=coordLabel(x,y);
  if(over)announce(winner?`${who} ${at} ${winPhrase(winner)}，${who}获胜，共 ${history.length} 手。`
                        :`${who} ${at}，棋盘已满，平局，共 ${history.length} 手。`);
  else announce(`${who} ${at}，第 ${history.length} 手，轮到${sideName(turn)}。`);
}
/* 光标播报：canvas 无棋盘语义，读屏用户靠这条消息知道「我在哪、这里能不能下」 */
function announceCursor(){
  if(over)return;
  const at=coordLabel(cursor.x,cursor.y),occ=board[cursor.x][cursor.y];
  if(mode!=='pvp'&&turn!==humanP){announce(`光标 ${at}。`);return;}
  if(occ!==EMPTY){announce(`光标 ${at}，已有${sideName(occ)}。`);return;}
  let note='';
  if(turn===BLACK){
    const t=blackLegality(cursor.x,cursor.y);
    if(t!=='ok'&&t!=='win')note='，禁手：'+FOUL_LABEL[t]+'，不可落子';
  }
  announce(`光标 ${at}${note}。`);
}
function dotHTML(p){return `<span class="stone-dot ${p===BLACK?'black':'white'}"></span>`;}
function updateHUD(){
  const mv=$('moveLabel'),tv=$('turnValue');
  mv.textContent=over?`共 ${history.length} 手`:`第 ${history.length+1} 手`;
  let html='';
  if(over){
    html=winner?dotHTML(winner)+`<span>${winner===BLACK?'黑棋':'白棋'}获胜</span>`:'<span>平局</span>';
  }else if(mode==='pvp'){
    html=dotHTML(turn)+`<span>${turn===BLACK?'黑棋':'白棋'}回合</span>`;
  }else{
    html=turn===humanP?dotHTML(turn)+'<span>你的回合</span>':dotHTML(turn)+`<span>${aiThinking?'AI 思考中…':'AI 回合'}</span>`;
  }
  tv.innerHTML=html;
  $('btnUndo').disabled=!history.length||aiThinking;
  updateFoulMarkers();
}

/* ================= 存档 ================= */
function saveSession(){
  syncElapsed();            /* 存档里的用时要是此刻的真实值，而不是上一次 tick 的值 */
  if(!history.length||over){LS.set('session',null);return;}
  LS.set('session',{mode,moves:history.map(m=>({x:m.x,y:m.y})),elapsed,over,side:humanP===BLACK?'B':'W'});
}

/* ================= 音效与触感 ================= */
/* 原生 Web Audio 落子音效：碰撞瞬态（7ms 带通噪声）+ 微弱实心共鸣（32ms 正弦），黑白不同音高 */
let audioCtx=null;
function playStoneSound(isWhite){
  if(!settings.sound)return;
  try{
    const AudioCtor=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtor)return;
    if(!audioCtx)audioCtx=new AudioCtor();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const t=audioCtx.currentTime;
    const bufLen=Math.max(1,Math.floor(audioCtx.sampleRate*0.007));
    const noiseBuf=audioCtx.createBuffer(1,bufLen,audioCtx.sampleRate);
    const out=noiseBuf.getChannelData(0);
    for(let i=0;i<bufLen;i++)out[i]=Math.random()*2-1;
    const noiseSrc=audioCtx.createBufferSource();
    noiseSrc.buffer=noiseBuf;
    const filter=audioCtx.createBiquadFilter();
    filter.type='bandpass';
    filter.frequency.setValueAtTime(isWhite?3200:2700,t);
    filter.Q.setValueAtTime(3.0,t);
    const noiseGain=audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.42,t);
    noiseGain.gain.exponentialRampToValueAtTime(0.001,t+0.007);
    noiseSrc.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);
    noiseSrc.start(t);
    const osc=audioCtx.createOscillator();
    const oscGain=audioCtx.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(isWhite?580:510,t);
    oscGain.gain.setValueAtTime(0.25,t);
    oscGain.gain.exponentialRampToValueAtTime(0.001,t+0.032);
    osc.connect(oscGain);
    oscGain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t+0.033);
  }catch(e){}
}
/* 胜利音：C5→E5→G5→C6 大三和弦轻快连音 */
function playWinSound(){
  if(!settings.sound)return;
  try{
    const AudioCtor=window.AudioContext||window.webkitAudioContext;
    if(!AudioCtor)return;
    if(!audioCtx)audioCtx=new AudioCtor();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const t=audioCtx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((freq,idx)=>{
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      const st=t+idx*0.08;
      osc.type='triangle';
      osc.frequency.setValueAtTime(freq,st);
      gain.gain.setValueAtTime(0.28,st);
      gain.gain.exponentialRampToValueAtTime(0.001,st+0.22);
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.start(st);osc.stop(st+0.22);
    });
  }catch(e){}
}
/* 触感：落子短促一击；胜利为多段欢庆节奏（仅支持 navigator.vibrate 的移动端） */
function triggerHaptic(type){
  try{
    if(!navigator.vibrate)return;
    navigator.vibrate(type==='win'?[40,60,40,60,60,80,80]:18);
  }catch(e){}
}
function updateSoundUI(){
  const on=settings.sound,icOn=$('icSoundOn'),icOff=$('icSoundOff'),txt=$('soundText');
  if(icOn&&icOff&&txt){
    icOn.style.display=on?'block':'none';
    icOff.style.display=on?'none':'block';
    txt.textContent='落子音效：'+(on?'开':'关');
  }
}

/* ================= 对局流程 ================= */
function newGame(silent){
  clearBoard();
  /* 重开时旧搜索仍占着 Worker（专家档最长 3 秒），新一局的第一手会排在它后面白等；直接换一个新 Worker */
  if(aiThinking&&aiWorker){dropWorker();initAiWorker();}
  history=[];turn=BLACK;over=false;winner=0;winCells=null;recorded=false;
  aiThinking=false;aiToken++;hover=null;kbdCursor=false;
  stopTimer();elapsed=0;timerFrac=0;$('timer').textContent='00:00';
  LS.set('session',null);
  updateHUD();scheduleDraw();
  if(!silent){
    announce('新的一局开始，黑棋先行。');
    maybeAI(); /* AI 执黑时自动开出第一手 */
  }
}
function placeAt(x,y,p){
  setCell(x,y,p);
  history.push({x,y,p,at:performance.now()});
  playStoneSound(p===WHITE);
  const wc=winCellsAt(x,y,p);
  if(wc){
    over=true;winner=p;winCells=wc;stopTimer();
    onGameEnd(p);                        /* 胜方振感/胜利音在其中按归属触发 */
  }else if(history.length===N*N){
    over=true;winner=0;stopTimer();
    triggerHaptic('move');
    onGameEnd(0);
  }else{
    turn=3-p;
    triggerHaptic('move');
  }
  if(history.length&&!over)startTimer();
  updateHUD();saveSession();scheduleDraw();announceMove(x,y,p);
}
function onGameEnd(p){
  aiThinking=false;const tok=++aiToken;
  if(p&&mode!=='pvp'&&!recorded){
    const r=recOf(mode.slice(3));
    if(p===humanP)r.w++;else r.l++;
    recorded=true;LS.set('records',records);
  }
  if(p){
    if(mode==='pvp'||p===humanP){       /* 人类获胜：庆祝振感 + 胜利音 */
      setTimeout(()=>{if(over&&tok===aiToken){triggerHaptic('win');playWinSound();}},70);
    }else triggerHaptic('move');
  }
  const showOver=()=>{if(!over||tok!==aiToken)return;if(dialogOpenFlag){setTimeout(showOver,500);return;}showGameOver(p);};
  setTimeout(showOver,750);
}
/* ================= AI Worker ================= */
/* 自举 Worker：主脚本的 CORE_START/END 段即完整引擎，原地打包成 Blob 放副线程，
   思考期间页面不冻结；环境不支持或打包失败时静默回退主线程同步搜索。 */
let aiWorker=null,aiWorkerUrl=null,thinkMinT=0,workerBudget=2,workerRebuild=false;
function dropWorker(){                           /* 终止并释放 Worker；之后 maybeAI 走主线程回退或由 initAiWorker 重建 */
  if(aiWorker){try{aiWorker.terminate();}catch(e){}}
  aiWorker=null;
  if(aiWorkerUrl){try{URL.revokeObjectURL(aiWorkerUrl);}catch(e){}aiWorkerUrl=null;}
}
/* 迟到/失效的 AI 回调：tok 已被重开、悔棋或终局接管时，思考态归新的持有者，旧回调不得改写；
   仍是当前 tok 但局面已不再轮到 AI，则只负责收起思考态。返回 true 表示应丢弃本次结果。 */
function aiStale(tok){
  if(tok!==aiToken)return true;
  if(over||turn!==aiP){aiThinking=false;updateHUD();return true;}
  return false;
}
function initAiWorker(){
  if(typeof Worker==='undefined'||typeof Blob==='undefined'||typeof URL==='undefined')return;
  try{
    const tag=document.getElementById('main');
    if(!tag)return;
    const src=tag.textContent,a=src.indexOf('/*CORE_START*/'),b=src.indexOf('/*CORE_END*/');
    if(a<0||b<0||b<a)return;
    const wsrc=src.slice(a,b)
      +'\nself.onmessage=function(e){var d=e.data;if(d&&d.type==="choose"){mode=d.mode;board=d.board;syncCand();self.postMessage({tok:d.tok,mv:aiChoose(d.p)});}};';
    const url=URL.createObjectURL(new Blob([wsrc],{type:'text/javascript'}));
    aiWorkerUrl=url; /* Worker 构造被 CSP 等拒绝时，catch 里的 dropWorker 也能撤销 URL */
    const w=new Worker(url);
    w.onmessage=function(e){
      const d=e.data;
      if(!d||d.tok!==aiToken)return;             /* 悔棋/重开/切换后到达的迟到结果 */
      const wait=Math.max(0,thinkMinT-Date.now());
      setTimeout(()=>{
        if(aiStale(d.tok))return;                /* P0：与主线程回退路径对齐，失效结果不得留下卡死的思考态 */
        aiThinking=false;
        if(d.mv)placeAt(d.mv.x,d.mv.y,aiP);
        else noLegalAI();
      },wait);
    };
    /* Worker 内部抛错或脚本加载失败时没有任何回信，思考态会永远卡住（悔棋被禁用、AI 不再落子）：
       丢弃 Worker 并把正在进行的这一手改由主线程完成，之后的对局也一直走主线程回退。 */
    w.onerror=function(ev){
      if(aiWorker!==w)return;
      if(ev&&ev.preventDefault)ev.preventDefault();
      dropWorker();
      if(workerBudget>0){workerBudget--;workerRebuild=true;}   /* 下一手重建 Worker，避免此后一直在主线程冻结界面 */
      if(aiThinking&&!over&&turn===aiP)thinkOnMain(aiToken);
    };
    w.onmessageerror=w.onerror;                  /* 结果无法反序列化时同样没有回信 */
    aiWorker=w;
  }catch(err){dropWorker();}
}
function noLegalAI(){                            /* AI 全盘无合法着法：按连珠规则判负 */
  over=true;winner=humanP;stopTimer();
  onGameEnd(humanP);
  updateHUD();saveSession();scheduleDraw();
}
function thinkOnMain(tok){                       /* 主线程同步搜索（无 Worker 或 Worker 失效时） */
  setTimeout(()=>{
    if(aiStale(tok))return;
    let mv=null,failed=false;
    try{mv=aiChoose(aiP);}catch(err){failed=true;}
    aiThinking=false;
    if(failed){                                  /* 引擎本身抛错：不能让思考态卡死，交还给玩家悔棋或重开 */
      updateHUD();scheduleDraw();
      toast('AI 计算出错，请悔棋或重开');
      return;
    }
    if(mv)placeAt(mv.x,mv.y,aiP);
    else noLegalAI();
  },Math.max(0,thinkMinT-Date.now()));
}
function maybeAI(){
  if(over||mode==='pvp'||turn!==aiP)return;
  aiThinking=true;updateHUD();scheduleDraw();
  const tok=++aiToken;
  thinkMinT=Date.now()+420+Math.random()*300;
  if(!aiWorker&&workerRebuild){workerRebuild=false;initAiWorker();}
  if(aiWorker){
    try{
      aiWorker.postMessage({type:'choose',mode:mode,p:aiP,board:board.map(r=>r.slice()),tok:tok});
      return;
    }catch(err){dropWorker();}                     /* 投递失败立刻回退主线程 */
  }
  thinkOnMain(tok);
}
function undo(){
  if(aiThinking||!history.length)return;
  if(over&&mode!=='pvp'&&recorded){
    const r=recOf(mode.slice(3));
    if(winner===humanP)r.w=Math.max(0,r.w-1);
    else if(winner)r.l=Math.max(0,r.l-1);
    recorded=false;LS.set('records',records);
  }
  if(over){over=false;winner=0;winCells=null;}
  /* 至少撤 1 手；人机模式再撤到轮到玩家为止。固定撤 2 手会在玩家刚落下制胜子时多撤 AI 的上一手，
     悔棋后反而轮到 AI 并让它重算。执白悔至空盘时轮到 AI 先手，由下面的 maybeAI 补一手。 */
  const popOne=()=>{const mv=history.pop();setCell(mv.x,mv.y,EMPTY);};
  popOne();
  if(mode!=='pvp')while(history.length&&(history.length%2===0?BLACK:WHITE)!==humanP)popOne();
  if(history.length)startTimer();
  else{
    stopTimer();
    /* 悔到空盘相当于回到开局：旧用时和不足一秒的余量都不能带进下一手。 */
    elapsed=0;timerFrac=0;$('timer').textContent=fmt(elapsed);
  }
  turn=history.length%2===0?BLACK:WHITE;
  aiToken++;aiThinking=false;
  updateHUD();saveSession();scheduleDraw();
  announce('已悔棋，回到第 '+(history.length+1)+' 手，轮到'+sideName(turn)+'。');
  maybeAI(); /* 悔棋后若轮到 AI 执黑（空盘回到 AI 先手），自动补一手 */
}

function eventCell(e){
  const rect=canvas.getBoundingClientRect(),G=geom();
  const px=e.clientX-rect.left,py=e.clientY-rect.top;
  const x=Math.round((px-G.m)/G.g),y=Math.round((py-G.m)/G.g);
  if(!inB(x,y))return null;
  if(Math.abs(px-(G.m+x*G.g))>G.g*0.55||Math.abs(py-(G.m+y*G.g))>G.g*0.55)return null;
  return {x,y};
}
const FOUL_LABEL={'33':'三三禁手','44':'四四禁手','overline':'长连禁手'};

function tryPlaceFromEvent(e){
  /* 菜单展开时，点在棋盘上的这一下只用来收起菜单（由随后的 click 事件完成），不能顺带落子 */
  if(menu.classList.contains('open'))return;

}
/* 手势区分：鼠标 / 触控笔按下即落子；手指触摸改为「抬起落子」，
   按下后移动超过阈值即判定为滑动翻页，取消落子且页面正常滚动 */
let touchTap=null; /* {x0,y0,id} */
const TAP_SLOP2=12*12; /* 允许 12px 以内的点击抖动 */
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch'){
    /* 只有主指针（第一根手指）可能是点击；其余手指按下一律视为手势（如双指缩放），取消待定点击。
       不能用「已有待定点击就取消、否则新建」来切换：三指时会重新建立点击，抬起其中一指就误落子，
       遗留的状态也无法自行恢复。 */
    touchTap=e.isPrimary?{x0:e.clientX,y0:e.clientY,id:e.pointerId}:null;
    return;
  }
  if(e.button!==0)return;   /* 右键/中键不落子（右键菜单已被屏蔽，仍会触发 pointerdown） */
  e.preventDefault();
  canvas.focus({preventScroll:true});
  tryPlaceFromEvent(e);
});
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'){
    if(touchTap&&e.pointerId===touchTap.id){
      const dx=e.clientX-touchTap.x0,dy=e.clientY-touchTap.y0;
      if(dx*dx+dy*dy>TAP_SLOP2)touchTap=null; /* 判定为滑动 */
    }
    return;
  }
  const c=eventCell(e);
  const changed=JSON.stringify(c)!==JSON.stringify(hover);
  hover=c;
  if(changed)scheduleDraw();
});
canvas.addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch')return;
  if(touchTap&&e.pointerId===touchTap.id){
    touchTap=null;
    canvas.focus({preventScroll:true});
    tryPlaceFromEvent(e);
  }
});
canvas.addEventListener('pointercancel',e=>{
  /* 浏览器接管手势（开始滚动/缩放）时触发，取消待定点击 */
  if(e.pointerType==='touch'&&touchTap&&e.pointerId===touchTap.id)touchTap=null;
});
canvas.addEventListener('pointerleave',()=>{hover=null;scheduleDraw();});
canvas.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= 键盘 ================= */
document.addEventListener('keydown',e=>{
  if(dialogOpenFlag){
    if(e.key==='Escape'){closeDialog();return;}
    /* aria-modal=true 就该把焦点留在对话框内：Tab / Shift+Tab 在弹窗内循环 */
    if(e.key==='Tab'){
      const f=[...dialog.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
        .filter(el=>!el.disabled&&el.offsetParent!==null);
      if(f.length){
        const first=f[0],last=f[f.length-1],a=document.activeElement;
        if(e.shiftKey&&(a===first||!dialog.contains(a))){e.preventDefault();last.focus();}
        else if(!e.shiftKey&&(a===last||!dialog.contains(a))){e.preventDefault();first.focus();}
      }
    }
    return;
  }
  const k=e.key;
  /* Escape 仍可关闭菜单；把焦点还给菜单按钮，避免焦点留在已隐藏菜单项上。 */
  if(k==='Escape'&&menu.classList.contains('open')){
    setMenuOpen(false);
    $('btnMenu').focus();
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  /* 不劫持按钮/链接/输入框的原生按键：Space/Enter 应触发其 click，
     方向键也不应在用户操作控件时移动棋盘光标。棋盘本身可通过 Tab 聚焦。 */
  const active=document.activeElement;
  if(active&&(active.isContentEditable||active.closest('button,a,input,textarea,select,[role="button"],[role="menuitem"],[contenteditable="true"]')))return;
  const tag=(active&&active.tagName)||'';
  if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  const mv={
    ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
    w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]
  }[k];
  if(mv){
    cursor.x=(cursor.x+mv[0]+N)%N;cursor.y=(cursor.y+mv[1]+N)%N;
    kbdCursor=true;hover=null;scheduleDraw();
    announceCursor();
    return;
  }
  if(k==='Enter'||k===' '){
    /* 键盘光标不可见时（刚点过鼠标/触屏、刚聚焦棋盘）第一下只显示并播报光标：
       否则会在看不见的旧光标处盲落一子。 */
    if(!kbdCursor&&!over){kbdCursor=true;hover=null;scheduleDraw();announceCursor();return;}
    tryHumanPlace({x:cursor.x,y:cursor.y});
    if(!over&&!dialogOpenFlag){kbdCursor=true;hover=null;scheduleDraw();} /* 键盘落子或禁手拒落后保留光标 */
    return;
  }
  /* 长按会连发 keydown：悔棋/重开只响应首次按下，避免一次长按连续悔掉多手或反复重开 */
  if(k==='z'||k==='Z'){if(!e.repeat)undo();return;}
  if(k==='r'||k==='R'){if(!e.repeat){newGame();toast('已开始新对局');}return;}
});
$('btnUndo').addEventListener('click',undo);
$('btnRestart').addEventListener('click',()=>{newGame();toast('已开始新对局');});

/* ================= 初始化 ================= */
function init(){
  /* 存储里的主题/配色可能被改坏：无效值会让 data-theme 落到没有任何样式规则的取值上，整页失去配色 */
  const sysTheme=document.documentElement.dataset.theme==='light'?'light':'dark';
  /* 从未手动选过主题（null）时保持「跟随系统」：不把首次访问时的系统主题写进存储，
     否则头部防闪烁脚本里的跟随分支只在第一次生效；存储值被改坏（非 null 的无效值）才落盘修正。 */
  if(settings.theme==null){
    refreshPalette();
    const mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
    if(mq&&mq.addEventListener)mq.addEventListener('change',ev=>{
      if(settings.theme!=null)return;      /* 用户之后手动选过主题：不再跟随 */
      document.documentElement.dataset.theme=ev.matches?'dark':'light';refreshPalette();
    });
  }else applyTheme(settings.theme==='light'||settings.theme==='dark'?settings.theme:sysTheme);
  applyAccent(isAccent(settings.accent)?settings.accent:'purple');
  applySide(settings.side==='W'?'W':'B');   /* 无效值回落为执黑（与 humanP 初值一致），避免两个执子按钮都不高亮 */
  updateSoundUI();
  initAiWorker();
  setMode(mode);
  /* 先读存档再 newGame（newGame 会清空存档）；引导阶段静默，等局面确定后再播报 */
  const ses=LS.get('session',null);
  newGame(true);
  if(ses&&Array.isArray(ses.moves)&&ses.moves.length&&!ses.over&&MODES_OK(ses.mode)){
    const origMode=mode,origSide=settings.side;
    try{
      /* P1：存档逐手校验（整数坐标、盘内、落点合法、未提前终局），任何一手畸形即整档作废。
         原实现对内容零校验，异常逃出 init() 会跳过末尾 fitBoard()，整页棋盘报废。 */
      const coordOK=ses.moves.length<N*N&&ses.moves.every(m=>m&&Number.isInteger(m.x)&&Number.isInteger(m.y)
        &&m.x>=0&&m.x<N&&m.y>=0&&m.y<N);
      if(!coordOK)throw new Error('corrupt session');
      setMode(ses.mode);
      if(ses.side==='B'||ses.side==='W')applySide(ses.side);
      newGame(true);
      for(const m of ses.moves){
        if(!isLegalMoveAt(turn,m.x,m.y))throw new Error('corrupt session'); /* 重复落点或黑方禁手 */
        setCell(m.x,m.y,turn);
        if(winCellsAt(m.x,m.y,turn))throw new Error('corrupt session'); /* 已分胜负却标为未终局 */
        history.push({x:m.x,y:m.y,p:turn,at:0});
        turn=3-turn;
      }
      turn=history.length%2===0?BLACK:WHITE;
      aiToken++;aiThinking=false;
      elapsed=Math.max(0,ses.elapsed|0);timerFrac=0;
      $('timer').textContent=fmt(elapsed);
      if(history.length)startTimer();
      updateHUD();saveSession();scheduleDraw();
      /* 回放不经过 placeAt，必须显式播报，否则读屏用户仍以为面对空盘 */
      announce(`已恢复对局，共 ${history.length} 手，轮到${sideName(turn)}。`);
    }catch(err){
      setMode(origMode);applySide(origSide);
      LS.set('session',null);
      newGame(true);
      updateHUD();scheduleDraw();
    }
  }
  if(mode!=='pvp'&&turn===aiP)maybeAI();
  fitBoard();
  setTimeout(fitBoard,80);
}
init();
/*APP_END*/
</script>
